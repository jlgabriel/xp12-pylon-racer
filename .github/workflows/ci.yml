name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck (both tsconfigs)
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  e2e:
    name: electron smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Playwright drives Electron's own Chromium: only its system libraries and a virtual display
      # are needed, no browser download.
      - name: Install Chromium/Electron system libraries
        run: npx --yes playwright install-deps chromium
      - name: e2e — build + Electron smoke under xvfb
        run: xvfb-run -a npm run test:e2e

  plugin:
    name: plugin · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04, not latest: a plugin built against an older glibc loads on more distributions.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    env:
      # Only tsx is needed to run the build script, not Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: OpenGL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev
      # Downloads the X-Plane SDK, builds the plugin and runs its parser test against the app's messages.
      - name: Build and test the plugin
        run: npm run plugin
