<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Pylon Racer app icon: an air-race pylon and the racing line around it. Source of the PNG and
       ICO files next to it (npm run icons). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24345f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="pylon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.5" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#c2380f"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.05" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="body"><path d="M414 826 L470 214 Q512 186 554 214 L610 826 Z"/></clipPath>
    <clipPath id="front"><rect x="0" y="540" width="1024" height="484"/></clipPath>
    <clipPath id="back"><rect x="0" y="0" width="1024" height="540"/></clipPath>
    <pattern id="checker" width="64" height="64" patternUnits="userSpaceOnUse" x="448" y="270">
      <rect width="64" height="64" fill="#ff5a1f"/>
      <rect width="32" height="32" fill="#fff"/>
      <rect x="32" y="32" width="32" height="32" fill="#fff"/>
    </pattern>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g transform="rotate(-16 512 540)">
    <ellipse cx="512" cy="540" rx="350" ry="112" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="30" clip-path="url(#back)"/>
  </g>
  <ellipse cx="512" cy="830" rx="170" ry="26" fill="#000" opacity="0.4"/>
  <path d="M414 826 L470 214 Q512 186 554 214 L610 826 Z" fill="url(#pylon)"/>
  <rect x="400" y="270" width="230" height="96" fill="url(#checker)" clip-path="url(#body)"/>
  <g transform="rotate(-16 512 540)">
    <ellipse cx="512" cy="540" rx="350" ry="112" fill="none" stroke="url(#near)" stroke-width="40" clip-path="url(#front)"/>
    <circle cx="862" cy="540" r="36" fill="#fff"/>
  </g>
</svg>
